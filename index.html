<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی شرطی دو نفره</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            box-sizing: border-box;
        }
        input, select {
            background: #0f172a;
            color: #fff;
            border: 1px solid #334155;
            text-align: center;
        }
        button {
            background-color: #6366f1;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: #4f46e5; }
        .stats {
            display: flex;
            justify-content: space-around;
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .hidden { display: none !important; }
        #status-msg { font-weight: bold; margin: 15px 0; color: #38bdf8; }
        #result-box { margin-top: 15px; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 8px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>پلتفرم شرطی 🎲</h2>
        
        <!-- بخش اول: ورود به اتاق -->
        <div id="lobby-section">
            <p>یک نام یا کد اتاق وارد کنید:</p>
            <input type="text" id="room-input" placeholder="مثلاً: 123">
            <button onclick="joinRoom()">ورود به اتاق</button>
        </div>

        <!-- بخش دوم: محیط بازی -->
        <div id="game-section" class="hidden">
            <div class="stats">
                <div>💰 سکه شما: <span id="my-coins">1000</span></div>
                <div>⚔️ سکه حریف: <span id="opp-coins">1000</span></div>
            </div>

            <div id="status-msg">منتظر ورود حریف...</div>

            <div id="controls-area" class="hidden">
                <select id="game-type" onchange="changeGame()">
                    <option value="rps">سنگ، کاغذ، قیچی</option>
                    <option value="dice">تاس انداختن 🎲</option>
                </select>

                <input type="number" id="bet-input" value="50" min="10" placeholder="مقدار شرط">

                <!-- پنل سنگ کاغذ قیچی -->
                <div id="rps-board">
                    <button onclick="makeMove('سنگ')">✊ سنگ</button>
                    <button onclick="makeMove('کاغذ')">✋ کاغذ</button>
                    <button onclick="makeMove('قیچی')">✌️ قیچی</button>
                </div>

                <!-- پنل تاس -->
                <div id="dice-board" class="hidden">
                    <button style="background-color: #22c55e;" onclick="rollDice()">🎲 تاس بینداز</button>
                </div>
            </div>

            <div id="result-box" class="hidden"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentRoom = '';

        function joinRoom() {
            const roomVal = document.getElementById('room-input').value.trim();
            if (!roomVal) {
                alert('لطفاً نام اتاق را وارد کنید.');
                return;
            }
            currentRoom = roomVal;
            socket.emit('join-room', currentRoom);

            // مخفی کردن بخش ورود و نشان دادن بخش بازی
            document.getElementById('lobby-section').classList.add('hidden');
            document.getElementById('game-section').classList.remove('hidden');
            document.getElementById('status-msg').innerText = 'وارد اتاق شدید. منتظر نفر دوم...';
        }

        // وقتی دو نفر کامل شدند
        socket.on('start-game', (data) => {
            document.getElementById('status-msg').innerText = data.message;
            document.getElementById('controls-area').classList.remove('hidden');
        });

        socket.on('room-full', (msg) => {
            alert(msg);
            location.reload();
        });

        function changeGame() {
            const type = document.getElementById('game-type').value;
            socket.emit('change-game', { roomId: currentRoom, gameType: type });
        }

        socket.on('game-type-changed', (type) => {
            document.getElementById('game-type').value = type;
            if (type === 'rps') {
                document.getElementById('rps-board').classList.remove('hidden');
                document.getElementById('dice-board').classList.add('hidden');
            } else {
                document.getElementById('rps-board').classList.add('hidden');
                document.getElementById('dice-board').classList.remove('hidden');
            }
        });

        function makeMove(move) {
            const bet = document.getElementById('bet-input').value;
            document.getElementById('status-msg').innerText = `انتخاب شما (${move}) ثبت شد. منتظر حریف...`;
            socket.emit('make-move', { roomId: currentRoom, move: move, betAmount: bet });
        }

        function rollDice() {
            const diceNum = Math.floor(Math.random() * 6) + 1;
            const bet = document.getElementById('bet-input').value;
            document.getElementById('status-msg').innerText = `تاس شما (${diceNum}) آمد. منتظر حریف...`;
            socket.emit('make-move', { roomId: currentRoom, move: diceNum, betAmount: bet });
        }

        socket.on('round-result', (data) => {
            document.getElementById('my-coins').innerText = data.myCoins;
            document.getElementById('opp-coins').innerText = data.oppCoins;

            const resBox = document.getElementById('result-box');
            resBox.classList.remove('hidden');
            resBox.innerHTML = `
                انتخاب شما: ${data.myMove} <br>
                انتخاب حریف: ${data.oppMove} <br><br>
                <b style="color: #4ade80;">${data.result}</b>
            `;
            document.getElementById('status-msg').innerText = 'دور جدید! انتخاب کنید:';
        });

        socket.on('opponent-left', (msg) => {
            document.getElementById('status-msg').innerText = msg;
            document.getElementById('controls-area').classList.add('hidden');
        });
    </script>
</body>
</html>
