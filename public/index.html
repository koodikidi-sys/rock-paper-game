<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گپ و بازی آنلاین - تلگرام استایل</title>
    <style>
        :root {
            --tg-bg: #0f172a;
            --tg-panel: #1e293b;
            --tg-accent: #2b5278;
            --tg-accent-hover: #386799;
            --tg-my-message: #2b5278;
            --tg-other-message: #182533;
            --tg-text: #f8fafc;
            --tg-gray: #94a3b8;
        }

        body { font-family: Tahoma, sans-serif; background-color: var(--tg-bg); color: var(--tg-text); text-align: center; margin: 0; padding: 10px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .container { background-color: var(--tg-panel); padding: 16px; border-radius: 16px; width: 100%; max-width: 440px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); position: relative; display: flex; flex-direction: column; height: 94vh; max-height: 800px; box-sizing: border-box; }
        
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; border-bottom: 1px solid #334155; padding-bottom: 6px; }
        
        .group-profile-box { background: rgba(0,0,0,0.2); padding: 6px 10px; border-radius: 8px; margin-bottom: 6px; text-align: right; display: flex; justify-content: space-between; align-items: center; }
        .group-info h3 { margin: 0; font-size: 14px; color: #38bdf8; }
        .group-info p { margin: 2px 0 0 0; font-size: 11px; color: var(--tg-gray); }
        .edit-profile-btn { background: none; border: none; color: #38bdf8; font-size: 12px; cursor: pointer; padding: 0; width: auto; }
        
        input, button { width: 100%; padding: 10px 12px; margin: 6px 0; border-radius: 8px; border: none; font-size: 14px; box-sizing: border-box; }
        input { background: #0b1329; color: #fff; border: 1px solid #334155; text-align: right; outline: none; }
        input:focus { border-color: #38bdf8; }
        
        button { background-color: var(--tg-accent); color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: var(--tg-accent-hover); }
        .btn-danger { background-color: #ef4444; font-size: 11px; padding: 4px 8px; width: auto; margin: 0; }
        .btn-secondary { background-color: #334155; }
        
        .donate-header-btn {
            background-color: #db2777; color: white; text-decoration: none; display: block;
            padding: 5px; border-radius: 8px; font-size: 11px; font-weight: bold; margin-bottom: 6px;
        }

        .game-selector { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 6px; }
        .game-selector button { background: #334155; font-size: 10px; padding: 6px 2px; margin: 0; }
        .game-selector button.active { background: #2b5278; border-bottom: 2px solid #38bdf8; }

        .stats { display: flex; justify-content: space-around; background: rgba(0,0,0,0.25); padding: 5px; border-radius: 8px; margin-bottom: 6px; font-size: 12px; }
        .hidden { display: none !important; }
        #status-msg { font-weight: bold; margin: 3px 0; color: #38bdf8; font-size: 11px; }
        
        .xo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 6px auto; max-width: 180px; }
        .xo-cell { background: #0b1329; border: 1px solid #334155; height: 45px; font-size: 20px; font-weight: bold; color: #38bdf8; display: flex; justify-content: center; align-items: center; cursor: pointer; border-radius: 6px; }

        .dice-box { background: rgba(0,0,0,0.2); padding: 6px; border-radius: 8px; margin: 4px 0; }
        .dice-result-text { font-size: 11px; line-height: 1.4; text-align: right; margin-top: 3px; }

        .hokm-box { background: rgba(0,0,0,0.2); padding: 6px; border-radius: 8px; margin: 4px 0; text-align: center; }
        .suit-btn { display: inline-block; width: 32px; height: 32px; margin: 2px; font-size: 15px; background: #334155; border-radius: 6px; border: none; cursor: pointer; }
        .cards-container { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-top: 4px; max-height: 100px; overflow-y: auto; }
        .card-item { background: #fff; color: #000; width: 32px; height: 44px; border-radius: 4px; font-weight: bold; font-size: 11px; display: flex; justify-content: center; align-items: center; cursor: pointer; }

        .gift-box { background: rgba(255,255,255,0.03); padding: 5px; border-radius: 6px; margin-top: 5px; display: flex; gap: 4px; align-items: center; }
        .gift-box input { margin: 0; padding: 5px; font-size: 11px; }
        .gift-box button { margin: 0; padding: 5px; font-size: 11px; width: 70px; background-color: #10b981; }

        .chat-container { display: flex; flex-direction: column; flex-grow: 1; background: #0b1329; border-radius: 10px; padding: 5px; margin-top: 5px; border: 1px solid #1e293b; overflow: hidden; }
        #chat-messages { flex-grow: 1; overflow-y: auto; font-size: 12px; margin-bottom: 5px; padding: 4px; display: flex; flex-direction: column; gap: 4px; text-align: right; }
        
        .message-bubble { max-width: 80%; padding: 5px 8px; border-radius: 8px; word-wrap: break-word; line-height: 1.35; position: relative; }
        .message-bubble.my-message { background-color: var(--tg-my-message); align-self: flex-start; border-bottom-right-radius: 2px; }
        .message-bubble.other-message { background-color: var(--tg-other-message); align-self: flex-end; border-bottom-left-radius: 2px; }
        .msg-sender { font-size: 10px; color: #38bdf8; margin-bottom: 2px; font-weight: bold; display: block; }
        
        .chat-input-row { display: flex; gap: 4px; margin: 0; }
        .chat-input-row input { text-align: right; padding: 6px 8px; margin: 0; font-size: 12px; }
        .chat-input-row button { width: 55px; margin: 0; padding: 6px; font-size: 12px; border-radius: 6px; }

        .footer-credit { font-size: 10px; color: var(--tg-gray); margin-top: 5px; }
        .error-msg { color: #ef4444; font-size: 11px; margin: 2px 0; }
        .success-msg { color: #4ade80; font-size: 11px; margin: 2px 0; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-row">
            <h2 id="app-title">گپ و بازی آنلاین 💬</h2>
            <button id="btn-leave" class="btn-danger hidden" onclick="leaveGroup()">خروج 🚪</button>
        </div>
        
        <a href="https://daramet.com/yasinafzhooli" target="_blank" class="donate-header-btn">💖 حمایت مالی برای خفن تر کردن بازی</a>

        <!-- فرم ورود و ثبت‌نام -->
        <div id="auth-section">
            <div id="login-form">
                <p style="font-size: 13px; margin: 4px 0;">ورود به حساب کاربری:</p>
                <input type="text" id="login-user" placeholder="نام کاربری">
                <input type="password" id="login-pass" placeholder="رمز عبور">
                <button onclick="loginUser()">ورود</button>
                <button class="btn-secondary" onclick="showRegister()">ساخت حساب جدید (ثبت‌نام)</button>
                <div id="login-alert" class="error-msg"></div>
            </div>

            <div id="register-form" class="hidden">
                <p style="font-size: 13px; margin: 4px 0;">ثبت‌نام حساب جدید:</p>
                <input type="text" id="reg-user" placeholder="نام کاربری دلخواه">
                <input type="password" id="reg-pass" placeholder="رمز عبور دلخواه">
                <button onclick="registerUser()">ثبت‌نام و ساخت اکانت</button>
                <button class="btn-secondary" onclick="showLogin()">بازگشت به ورود</button>
                <div id="reg-alert" class="error-msg"></div>
            </div>
        </div>

        <!-- لابی گروه -->
        <div id="lobby" class="hidden">
            <p id="welcome-msg" style="color: #38bdf8; font-weight: bold; font-size: 13px;"></p>
            <p style="font-size: 12px;">نام گروه را وارد کنید:</p>
            <input type="text" id="room-code" placeholder="نام گروه (مثلاً: dorehami)">
            <button onclick="connectRoom()">ورود به گروه</button>
            <button class="btn-secondary" onclick="logoutUser()" style="margin-top: 10px;">خروج از حساب کاربری 🔒</button>
        </div>

        <!-- محیط اصلی گروه -->
        <div id="game-room" class="hidden" style="display: flex; flex-direction: column; flex-grow: 1;">
            
            <!-- پروفایل گروه -->
            <div class="group-profile-box">
                <div class="group-info">
                    <h3 id="group-title-view">نام گروه</h3>
                    <p id="group-desc-view">توضیحات گروه...</p>
                </div>
                <button class="edit-profile-btn" onclick="openEditProfile()">✏️ ویرایش</button>
            </div>

            <!-- پنل ویرایش پروفایل گروه -->
            <div id="edit-profile-panel" class="hidden" style="background: #0b1329; padding: 8px; border-radius: 8px; margin-bottom: 6px; text-align: right;">
                <input type="text" id="edit-group-title" placeholder="نام جدید گروه" style="font-size: 11px; padding: 5px;">
                <input type="text" id="edit-group-desc" placeholder="توضیحات جدید گروه" style="font-size: 11px; padding: 5px;">
                <div style="display: flex; gap: 4px;">
                    <button onclick="saveGroupProfile()" style="padding: 5px; font-size: 11px; margin: 0;">ذخیره</button>
                    <button class="btn-secondary" onclick="closeEditProfile()" style="padding: 5px; font-size: 11px; margin: 0;">لغو</button>
                </div>
            </div>

            <div class="game-selector">
                <button id="btn-rps" class="active" onclick="switchGame('rps')">سنگ کاغذ</button>
                <button id="btn-xo" onclick="switchGame('xo')">دوز XO</button>
                <button id="btn-dice" onclick="switchGame('dice')">تاس 🎲</button>
                <button id="btn-hokm" onclick="switchGame('hokm')">حکم ♠️</button>
            </div>

            <div class="stats">
                <div>💰 سکه شما: <span id="my-coins">300</span></div>
                <div id="player-count-box">👥 نفرات: <span id="player-count">1</span>/4</div>
            </div>

            <div id="status-msg">در انتظار دوستان...</div>

            <!-- بازی‌ها -->
            <div id="rps-section">
                <div id="controls" class="hidden">
                    <button onclick="makeMove('سنگ')">✊ سنگ</button>
                    <button onclick="makeMove('کاغذ')">✋ کاغذ</button>
                    <button onclick="makeMove('قیچی')">✌️ قیچی</button>
                </div>
                <div id="result-box" class="hidden" style="font-size: 11px; margin: 3px 0;"></div>
            </div>

            <div id="xo-section" class="hidden">
                <div class="xo-grid" id="xo-board">
                    <div class="xo-cell" onclick="makeXoMove(0)"></div>
                    <div class="xo-cell" onclick="makeXoMove(1)"></div>
                    <div class="xo-cell" onclick="makeXoMove(2)"></div>
                    <div class="xo-cell" onclick="makeXoMove(3)"></div>
                    <div class="xo-cell" onclick="makeXoMove(4)"></div>
                    <div class="xo-cell" onclick="makeXoMove(5)"></div>
                    <div class="xo-cell" onclick="makeXoMove(6)"></div>
                    <div class="xo-cell" onclick="makeXoMove(7)"></div>
                    <div class="xo-cell" onclick="makeXoMove(8)"></div>
                </div>
            </div>

            <div id="dice-section" class="hidden">
                <div class="dice-box">
                    <button id="btn-roll" onclick="rollDice()">🎲 انداختن تاس</button>
                    <div id="dice-result" class="dice-result-text">هنوز تاسی انداخته نشده.</div>
                </div>
            </div>

            <div id="hokm-section" class="hidden">
                <div class="hokm-box">
                    <div id="hokm-info" style="font-size: 11px;">در انتظار تکمیل ۴ بازیکن...</div>
                    <div id="hokm-controls" class="hidden">
                        <button class="suit-btn" onclick="selectHokm('♠️')">♠️</button>
                        <button class="suit-btn" onclick="selectHokm('♥️')">♥️</button>
                        <button class="suit-btn" onclick="selectHokm('♦️')">♦️</button>
                        <button class="suit-btn" onclick="selectHokm('♣️')">♣️</button>
                    </div>
                    <div id="my-cards" class="cards-container"></div>
                </div>
            </div>

            <!-- هدیه سکه -->
            <div class="gift-box">
                <input type="text" id="gift-user" placeholder="نام کاربری دوست..." style="flex: 2;">
                <input type="number" id="gift-amount" placeholder="مقدار" style="flex: 1;">
                <button onclick="sendCoinGift()">هدیه 🎁</button>
            </div>

            <!-- چت -->
            <div class="chat-container">
                <div id="chat-messages"></div>
                <div class="chat-input-row">
                    <input type="text" id="chat-input" placeholder="پیام..." onkeydown="checkEnter(event)">
                    <button onclick="sendMessage()">ارسال</button>
                </div>
            </div>
        </div>

        <div class="footer-credit">ساخته شده با عشق توسط یاسین افژولی</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentRoom = localStorage.getItem('chat_game_room') || '';
        let myName = localStorage.getItem('chat_game_user') || '';

        window.onload = () => {
            if (myName) {
                document.getElementById('auth-section').classList.add('hidden');
                if (currentRoom) {
                    // اگر کاربر قبل از رفرش داخل اتاق بوده، مستقیم بفرستش داخل همون اتاق
                    socket.emit('join-room', { roomId: currentRoom, username: myName });
                    document.getElementById('game-room').classList.remove('hidden');
                    document.getElementById('btn-leave').classList.remove('hidden');
                } else {
                    document.getElementById('lobby').classList.remove('hidden');
                    document.getElementById('welcome-msg').innerText = `سلام، ${myName}! 👋`;
                }
            }
        };

        function showRegister() {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('register-form').classList.remove('hidden');
        }

        function showLogin() {
            document.getElementById('register-form').classList.add('hidden');
            document.getElementById('login-form').classList.remove('hidden');
        }

        async function registerUser() {
            const username = document.getElementById('reg-user').value.trim();
            const password = document.getElementById('reg-pass').value.trim();
            const alertBox = document.getElementById('reg-alert');

            if (!username || !password) {
                alertBox.innerText = 'لطفاً فیلدها را پر کنید.';
                return;
            }

            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();

            if (data.success) {
                alertBox.className = 'success-msg';
                alertBox.innerText = data.message;
                setTimeout(showLogin, 1500);
            } else {
                alertBox.className = 'error-msg';
                alertBox.innerText = data.message;
            }
        }

        async function loginUser() {
            const username = document.getElementById('login-user').value.trim();
            const password = document.getElementById('login-pass').value.trim();
            const alertBox = document.getElementById('login-alert');

            if (!username || !password) {
                alertBox.innerText = 'لطفاً نام کاربری و رمز عبور را وارد کنید.';
                return;
            }

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();

            if (data.success) {
                myName = data.username;
                localStorage.setItem('chat_game_user', myName);
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('lobby').classList.remove('hidden');
                document.getElementById('welcome-msg').innerText = `سلام، ${myName}! 👋`;
                document.getElementById('my-coins').innerText = data.coins;
            } else {
                alertBox.innerText = data.message;
            }
        }

        function logoutUser() {
            localStorage.removeItem('chat_game_user');
            localStorage.removeItem('chat_game_room');
            myName = '';
            currentRoom = '';
            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('login-user').value = '';
            document.getElementById('login-pass').value = '';
        }

        function connectRoom() {
            const code = document.getElementById('room-code').value.trim();
            if (!code) {
                alert('لطفاً نام گروه را وارد کنید.');
                return;
            }
            currentRoom = code;
            localStorage.setItem('chat_game_room', currentRoom); // ذخیره اتاق در مرورگر
            socket.emit('join-room', { roomId: currentRoom, username: myName });

            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('game-room').classList.remove('hidden');
            document.getElementById('btn-leave').classList.remove('hidden');
        }

        function leaveGroup() {
            currentRoom = '';
            localStorage.removeItem('chat_game_room'); // حذف اتاق از حافظه
            document.getElementById('game-room').classList.add('hidden');
            document.getElementById('btn-leave').classList.add('hidden');
            document.getElementById('lobby').classList.remove('hidden');
            document.getElementById('room-code').value = '';
        }

        function openEditProfile() {
            document.getElementById('edit-profile-panel').classList.remove('hidden');
            document.getElementById('edit-group-title').value = document.getElementById('group-title-view').innerText;
            document.getElementById('edit-group-desc').value = document.getElementById('group-desc-view').innerText;
        }

        function closeEditProfile() {
            document.getElementById('edit-profile-panel').classList.add('hidden');
        }

        function saveGroupProfile() {
            const title = document.getElementById('edit-group-title').value.trim();
            const description = document.getElementById('edit-group-desc').value.trim();
            socket.emit('update-group-profile', { roomId: currentRoom, title, description });
            closeEditProfile();
        }

        socket.on('room-profile', (profile) => {
            document.getElementById('group-title-view').innerText = profile.title;
            document.getElementById('group-desc-view').innerText = profile.description;
        });

        function sendCoinGift() {
            const targetUser = document.getElementById('gift-user').value.trim();
            const amount = document.getElementById('gift-amount').value.trim();
            if (!targetUser || !amount) {
                alert('نام کاربری و مقدار سکه را وارد کنید.');
                return;
            }
            socket.emit('transfer-coins', { targetUser, amount, senderUser: myName });
        }

        socket.on('transfer-result', (data) => {
            alert(data.message);
            if (data.success) {
                document.getElementById('my-coins').innerText = data.newCoins;
                document.getElementById('gift-user').value = '';
                document.getElementById('gift-amount').value = '';
            }
        });

        socket.on('joined', (data) => {
            document.getElementById('my-coins').innerText = data.coins;
        });

        socket.on('update-players', (data) => {
            document.getElementById('player-count').innerText = data.count;
        });

        socket.on('start-game', (data) => {
            document.getElementById('status-msg').innerText = data.msg;
            if (currentGame === 'rps') {
                document.getElementById('controls').classList.remove('hidden');
            }
        });

        socket.on('room-full', (msg) => {
            alert(msg);
            leaveGroup();
        });

        let currentGame = 'rps';
        function switchGame(gameType) {
            currentGame = gameType;
            document.getElementById('btn-rps').classList.remove('active');
            document.getElementById('btn-xo').classList.remove('active');
            document.getElementById('btn-dice').classList.remove('active');
            document.getElementById('btn-hokm').classList.remove('active');

            document.getElementById('rps-section').classList.add('hidden');
            document.getElementById('xo-section').classList.add('hidden');
            document.getElementById('dice-section').classList.add('hidden');
            document.getElementById('hokm-section').classList.add('hidden');

            if (gameType === 'rps') {
                document.getElementById('btn-rps').classList.add('active');
                document.getElementById('rps-section').classList.remove('hidden');
            } else if (gameType === 'xo') {
                document.getElementById('btn-xo').classList.add('active');
                document.getElementById('xo-section').classList.remove('hidden');
            } else if (gameType === 'dice') {
                document.getElementById('btn-dice').classList.add('active');
                document.getElementById('dice-section').classList.remove('hidden');
            } else if (gameType === 'hokm') {
                document.getElementById('btn-hokm').classList.add('active');
                document.getElementById('hokm-section').classList.remove('hidden');
            }
            socket.emit('change-game', { roomId: currentRoom, gameType });
        }

        socket.on('game-changed', (data) => {
            currentGame = data.gameType;
            document.getElementById('btn-rps').classList.remove('active');
            document.getElementById('btn-xo').classList.remove('active');
            document.getElementById('btn-dice').classList.remove('active');
            document.getElementById('btn-hokm').classList.remove('active');

            document.getElementById('rps-section').classList.add('hidden');
            document.getElementById('xo-section').classList.add('hidden');
            document.getElementById('dice-section').classList.add('hidden');
            document.getElementById('hokm-section').classList.add('hidden');

            if (data.gameType === 'rps') {
                document.getElementById('btn-rps').classList.add('active');
                document.getElementById('rps-section').classList.remove('hidden');
                document.getElementById('controls').classList.remove('hidden');
            } else if (data.gameType === 'xo') {
                document.getElementById('btn-xo').classList.add('active');
                document.getElementById('xo-section').classList.remove('hidden');
                updateXoBoard(data.xoBoard, data.xoTurn);
            } else if (data.gameType === 'dice') {
                document.getElementById('btn-dice').classList.add('active');
                document.getElementById('dice-section').classList.remove('hidden');
            } else if (data.gameType === 'hokm') {
                document.getElementById('btn-hokm').classList.add('active');
                document.getElementById('hokm-section').classList.remove('hidden');
            }
        });

        socket.on('hokm-deal-first', (data) => {
            renderMyCards(data.hand);
            if (data.isHakem) {
                document.getElementById('hokm-controls').classList.remove('hidden');
                document.getElementById('hokm-info').innerText = 'شما حاکم هستید!';
            } else {
                document.getElementById('hokm-controls').classList.add('hidden');
                document.getElementById('hokm-info').innerText = `حاکم (${data.hakemName}) در حال انتخاب...`;
            }
        });

        function selectHokm(suit) {
            socket.emit('select-hokm', { roomId: currentRoom, suit });
            document.getElementById('hokm-controls').classList.add('hidden');
        }

        socket.on('hokm-game-started', (data) => {
            renderMyCards(data.hand);
            document.getElementById('hokm-info').innerText = `حکم: ${data.suit}`;
        });

        function renderMyCards(hand) {
            const container = document.getElementById('my-cards');
            container.innerHTML = '';
            hand.forEach(card => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card-item';
                if (card.suit === '♥️' || card.suit === '♦️') cardEl.style.color = '#ef4444';
                cardEl.innerText = card.name;
                cardEl.onclick = () => socket.emit('play-card', { roomId: currentRoom, card });
                container.appendChild(cardEl);
            });
        }

        function makeMove(move) {
            document.getElementById('controls').classList.add('hidden');
            socket.emit('make-move', { roomId: currentRoom, move: move });
        }

        socket.on('round-result', (data) => {
            document.getElementById('my-coins').innerText = data.myCoins;
            const resBox = document.getElementById('result-box');
            resBox.classList.remove('hidden');
            resBox.innerHTML = `شما: ${data.myMove} | حریف: ${data.oppMove} <br><b style="color: #4ade80;">${data.result}</b>`;
            document.getElementById('controls').classList.remove('hidden');
        });

        function makeXoMove(index) {
            if (currentGame !== 'xo') return;
            socket.emit('make-xo-move', { roomId: currentRoom, index });
        }

        socket.on('xo-update', (data) => { updateXoBoard(data.board, data.xoTurn); });
        socket.on('xo-game-over', (data) => {
            updateXoBoard(data.board, null);
            document.getElementById('my-coins').innerText = data.myCoins1;
        });

        function updateXoBoard(board, turn) {
            const cells = document.querySelectorAll('.xo-cell');
            cells.forEach((cell, idx) => { cell.innerText = board[idx]; });
        }

        function rollDice() {
            document.getElementById('btn-roll').setAttribute('disabled', 'true');
            socket.emit('roll-dice', { roomId: currentRoom });
        }

        socket.on('dice-round-result', (data) => {
            let text = '<b>نتایج تاس:</b><br>';
            for (let pId in data.rolls) {
                text += `${data.names[pId]}: ${data.rolls[pId]}<br>`;
            }
            document.getElementById('dice-result').innerHTML = text;
            if (data.scores[socket.id] !== undefined) {
                document.getElementById('my-coins').innerText = data.scores[socket.id];
            }
            setTimeout(() => { document.getElementById('btn-roll').removeAttribute('disabled'); }, 2000);
        });

        function checkEnter(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                sendMessage();
            }
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (!msg) return;

            // پیام مستقیماً به سرور فرستاده می‌شود و سرور به همه (از جمله خودمان) پخش می‌کند
            socket.emit('send-message', { roomId: currentRoom, message: msg, senderName: myName });
            input.value = '';
        }

        // دریافت پیام از سرور (برای همه اعضا از جمله فرستنده)
        socket.on('receive-message', (data) => {
            const isMe = (data.senderName === myName);
            appendMessage(data.senderName, data.message, isMe);
        });

        socket.on('load-chat-history', (history) => {
            const chatBox = document.getElementById('chat-messages');
            chatBox.innerHTML = '';
            history.forEach(chat => {
                appendMessage(chat.senderName, chat.message, (chat.senderName === myName));
            });
        });

        function appendMessage(sender, text, isMe) {
            const chatBox = document.getElementById('chat-messages');
            const bubble = document.createElement('div');
            bubble.className = `message-bubble ${isMe ? 'my-message' : 'other-message'}`;
            
            let content = '';
            if (!isMe) content += `<span class="msg-sender">${sender}</span>`;
            content += `<span>${text}</span>`;
            bubble.innerHTML = content;

            chatBox.appendChild(bubble);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
