<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گپ و بازی آنلاین</title>
    <style>
        :root { --tg-bg: #0f172a; --tg-panel: #1e293b; --tg-accent: #2b5278; --tg-text: #f8fafc; --tg-gray: #94a3b8; }
        body { font-family: Tahoma, sans-serif; background-color: var(--tg-bg); color: var(--tg-text); text-align: center; margin: 0; padding: 10px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .container { background-color: var(--tg-panel); padding: 16px; border-radius: 16px; width: 100%; max-width: 440px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; flex-direction: column; height: 95vh; max-height: 850px; box-sizing: border-box; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; border-bottom: 1px solid #334155; padding-bottom: 6px; }
        h2 { margin: 0; font-size: 15px; color: #38bdf8; }
        .donate-header-btn { background-color: #db2777; color: white; text-decoration: none; display: block; padding: 5px; border-radius: 8px; font-size: 11px; font-weight: bold; margin-bottom: 5px; }
        .group-profile-box { background: rgba(0,0,0,0.2); padding: 5px 8px; border-radius: 8px; margin-bottom: 5px; text-align: right; display: flex; justify-content: space-between; align-items: center; }
        .group-info h3 { margin: 0; font-size: 13px; color: #38bdf8; }
        .group-info p { margin: 2px 0 0 0; font-size: 10px; color: var(--tg-gray); }
        .members-box { background: rgba(0,0,0,0.2); padding: 5px; border-radius: 8px; margin-bottom: 5px; text-align: right; max-height: 70px; overflow-y: auto; }
        .members-title { font-size: 10px; color: var(--tg-gray); margin-bottom: 2px; font-weight: bold; }
        .member-item { font-size: 11px; margin: 3px 0; display: flex; justify-content: space-between; align-items: center; background: #334155; padding: 3px 6px; border-radius: 6px; }
        input, button { width: 100%; padding: 9px 11px; margin: 5px 0; border-radius: 8px; border: none; font-size: 13px; box-sizing: border-box; }
        input { background: #0b1329; color: #fff; border: 1px solid #334155; text-align: right; outline: none; }
        button { background-color: var(--tg-accent); color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #386799; }
        .btn-danger { background-color: #ef4444; font-size: 11px; padding: 4px 8px; width: auto; margin: 0; }
        .btn-secondary { background-color: #334155; }
        .stats { display: flex; justify-content: space-around; background: rgba(0,0,0,0.25); padding: 5px; border-radius: 8px; margin-bottom: 5px; font-size: 11px; }
        .hidden { display: none !important; }
        .game-arena { background: #0b1329; border: 1px solid #334155; padding: 10px; border-radius: 10px; margin-bottom: 5px; text-align: center; }
        .xo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin: 8px auto; max-width: 160px; }
        .xo-cell { background: #1e293b; border: 1px solid #334155; height: 45px; font-size: 20px; font-weight: bold; color: #38bdf8; display: flex; justify-content: center; align-items: center; cursor: pointer; border-radius: 6px; }
        .chat-container { display: flex; flex-direction: column; flex-grow: 1; background: #0b1329; border-radius: 10px; padding: 5px; margin-top: 4px; border: 1px solid #1e293b; overflow: hidden; }
        #chat-messages { flex-grow: 1; overflow-y: auto; font-size: 11px; margin-bottom: 4px; padding: 4px; display: flex; flex-direction: column; gap: 4px; text-align: right; }
        .message-bubble { max-width: 80%; padding: 5px 8px; border-radius: 8px; word-wrap: break-word; line-height: 1.35; position: relative; }
        .message-bubble.my-message { background-color: var(--tg-my-message); align-self: flex-start; border-bottom-right-radius: 2px; }
        .message-bubble.other-message { background-color: var(--tg-other-message); align-self: flex-end; border-bottom-left-radius: 2px; }
        .msg-sender { font-size: 9px; color: #38bdf8; margin-bottom: 2px; font-weight: bold; display: block; }
        .chat-input-row { display: flex; gap: 4px; margin: 0; }
        .chat-input-row input { text-align: right; padding: 5px 7px; margin: 0; font-size: 11px; }
        .chat-input-row button { width: 50px; margin: 0; padding: 5px; font-size: 11px; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-row">
            <h2>گپ و بازی آنلاین 💬</h2>
            <button id="btn-leave" class="btn-danger hidden" onclick="leaveGroup()">خروج 🚪</button>
        </div>

        <a href="https://daramet.com/yasinafzhooli" target="_blank" class="donate-header-btn">💖 حمایت مالی</a>

        <div id="auth-section">
            <div id="login-form">
                <input type="text" id="login-user" placeholder="نام کاربری">
                <input type="password" id="login-pass" placeholder="رمز عبور">
                <button onclick="loginUser()">ورود</button>
                <button class="btn-secondary" onclick="showRegister()">ثبت‌نام</button>
                <div id="login-alert" style="color:#ef4444; font-size:11px;"></div>
            </div>
            <div id="register-form" class="hidden">
                <input type="text" id="reg-user" placeholder="نام کاربری">
                <input type="password" id="reg-pass" placeholder="رمز عبور">
                <button onclick="registerUser()">ثبت‌نام نهایی</button>
                <button class="btn-secondary" onclick="showLogin()">بازگشت</button>
                <div id="reg-alert" style="color:#ef4444; font-size:11px;"></div>
            </div>
        </div>

        <div id="lobby" class="hidden">
            <p id="welcome-msg" style="color: #38bdf8; font-weight: bold; font-size: 12px;"></p>
            <input type="text" id="room-code" placeholder="نام گروه">
            <button onclick="connectRoom()">ورود به گروه</button>
            <button class="btn-secondary" onclick="logoutUser()">خروج از حساب</button>
        </div>

        <div id="game-room" class="hidden" style="display: flex; flex-direction: column; flex-grow: 1;">
            <div class="group-profile-box">
                <div class="group-info">
                    <h3 id="group-title-view">گروه</h3>
                    <p id="group-desc-view">...</p>
                </div>
            </div>

            <!-- پنل گزینه‌های ۴ گانه بازی -->
            <div style="background: rgba(0,0,0,0.3); padding: 6px; border-radius: 8px; margin-bottom: 5px; text-align: right;">
                <div style="font-size: 11px; color: #38bdf8; font-weight: bold; margin-bottom: 4px;">🎮 انتخاب حالت بازی:</div>
                <button class="btn-secondary" style="font-size: 10px; padding: 4px; margin: 2px 0;" onclick="openBotGame()">۱. بازی تک‌نفره (با ربات)</button>
                <button class="btn-secondary" style="font-size: 10px; padding: 4px; margin: 2px 0;" onclick="joinQueue('dice3')">۳. ورود به صف تاس ۳ نفره</button>
                <button class="btn-secondary" style="font-size: 10px; padding: 4px; margin: 2px 0;" onclick="joinQueue('hokm4')">۴. ورود به صف حکم ۴ نفره</button>
            </div>

            <div class="members-box">
                <div class="members-title">👥 ۲. بازی دونفره (کلیک روی دوست برای دعوت):</div>
                <div id="members-list"></div>
            </div>

            <div class="stats">
                <div>💰 سکه: <span id="my-coins">300</span></div>
            </div>

            <div id="game-arena-box" class="game-arena hidden">
                <div id="arena-status" style="font-size: 12px; font-weight: bold; color: #38bdf8; margin-bottom: 5px;"></div>
                
                <div id="arena-rps" class="hidden">
                    <button onclick="playRpsAction('سنگ')">✊ سنگ</button>
                    <button onclick="playRpsAction('کاغذ')">✋ کاغذ</button>
                    <button onclick="playRpsAction('قیچی')">✌️ قیچی</button>
                    <div id="rps-res" style="font-size: 11px; margin-top: 4px;"></div>
                </div>

                <div id="arena-xo" class="hidden">
                    <div class="xo-grid" id="xo-board">
                        <div class="xo-cell" onclick="playXo(0)"></div>
                        <div class="xo-cell" onclick="playXo(1)"></div>
                        <div class="xo-cell" onclick="playXo(2)"></div>
                        <div class="xo-cell" onclick="playXo(3)"></div>
                        <div class="xo-cell" onclick="playXo(4)"></div>
                        <div class="xo-cell" onclick="playXo(5)"></div>
                        <div class="xo-cell" onclick="playXo(6)"></div>
                        <div class="xo-cell" onclick="playXo(7)"></div>
                        <div class="xo-cell" onclick="playXo(8)"></div>
                    </div>
                </div>

                <div id="arena-dice" class="hidden">
                    <button onclick="rollDice()">🎲 انداختن تاس</button>
                    <div id="dice-res" style="font-size: 11px; margin-top: 4px;"></div>
                </div>

                <button class="btn-secondary" onclick="closeArena()" style="padding: 4px; font-size: 10px; margin-top: 5px;">بستن میز بازی</button>
            </div>

            <div class="chat-container">
                <div id="chat-messages"></div>
                <div class="chat-input-row">
                    <input type="text" id="chat-input" placeholder="پیام..." onkeydown="if(event.key==='Enter') sendMessage()">
                    <button onclick="sendMessage()">ارسال</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentRoom = localStorage.getItem('chat_game_room') || '';
        let myName = localStorage.getItem('chat_game_user') || '';
        let activeSessionId = null;
        let isBotMode = false;

        window.onload = () => {
            if (myName) {
                document.getElementById('auth-section').classList.add('hidden');
                if (currentRoom) {
                    socket.emit('join-room', { roomId: currentRoom, username: myName });
                    document.getElementById('game-room').classList.remove('hidden');
                    document.getElementById('btn-leave').classList.remove('hidden');
                } else {
                    document.getElementById('lobby').classList.remove('hidden');
                    document.getElementById('welcome-msg').innerText = `سلام، ${myName}!`;
                }
            }
        };

        function showRegister() { document.getElementById('login-form').classList.add('hidden'); document.getElementById('register-form').classList.remove('hidden'); }
        function showLogin() { document.getElementById('register-form').classList.add('hidden'); document.getElementById('login-form').classList.remove('hidden'); }

        async function registerUser() {
            let username = document.getElementById('reg-user').value.trim();
            let password = document.getElementById('reg-pass').value.trim();
            let res = await fetch('/api/register', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({username, password}) });
            let data = await res.json();
            if (data.success) showLogin(); else document.getElementById('reg-alert').innerText = data.message;
        }

        async function loginUser() {
            let username = document.getElementById('login-user').value.trim();
            let password = document.getElementById('login-pass').value.trim();
            let res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({username, password}) });
            let data = await res.json();
            if (data.success) {
                myName = data.username;
                localStorage.setItem('chat_game_user', myName);
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('lobby').classList.remove('hidden');
                document.getElementById('welcome-msg').innerText = `سلام، ${myName}!`;
                document.getElementById('my-coins').innerText = data.coins;
            } else {
                document.getElementById('login-alert').innerText = data.message;
            }
        }

        function logoutUser() { localStorage.clear(); location.reload(); }
        function connectRoom() {
            let code = document.getElementById('room-code').value.trim();
            if (!code) return;
            currentRoom = code;
            localStorage.setItem('chat_game_room', currentRoom);
            socket.emit('join-room', { roomId: currentRoom, username: myName });
            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('game-room').classList.remove('hidden');
            document.getElementById('btn-leave').classList.remove('hidden');
        }
        function leaveGroup() { localStorage.removeItem('chat_game_room'); location.reload(); }

        socket.on('room-profile', p => {
            document.getElementById('group-title-view').innerText = p.title;
            document.getElementById('group-desc-view').innerText = p.description;
        });

        socket.on('update-members', members => {
            let list = document.getElementById('members-list');
            list.innerHTML = '';
            members.forEach(m => {
                if (m.username !== myName) {
                    let div = document.createElement('div');
                    div.className = 'member-item';
                    div.innerHTML = `<span>👤 ${m.username}</span> <button style="width:auto; padding:2px 6px; font-size:10px;" onclick="challengeFriend('${m.id}', '${m.username}')">دعوت 🎮</button>`;
                    list.appendChild(div);
                }
            });
        });

        // گزینه ۱: بازی با ربات
        function openBotGame() {
            isBotMode = true;
            document.getElementById('game-arena-box').classList.remove('hidden');
            document.getElementById('arena-rps').classList.remove('hidden');
            document.getElementById('arena-xo').classList.add('hidden');
            document.getElementById('arena-dice').classList.add('hidden');
            document.getElementById('arena-status').innerText = 'بازی با ربات (سنگ کاغذ قیچی)';
            document.getElementById('rps-res').innerText = '';
        }

        // گزینه ۲: دعوت دوست
        function challengeFriend(targetId, targetName) {
            let g = prompt(`انتخاب بازی دونفره با ${targetName}:\n1. دوز (xo)\n2. سنگ‌کاغذ‌قیچی (rps)\n3. تاس (dice)`, '1');
            if (!g) return;
            let gameType = g === '2' || g.includes('rps') ? 'rps' : (g === '3' || g.includes('dice') ? 'dice' : 'xo');
            socket.emit('challenge-player', { targetId, gameType, roomId: currentRoom });
            alert('درخواست بازی ارسال شد.');
        }

        socket.on('game-challenge-received', d => {
            if (confirm(`${d.challengerName} شما را به بازی ${d.gameType} دعوت کرده است. قبول می‌کنید؟`)) {
                socket.emit('accept-challenge', { challengerId: d.challengerId, gameType: d.gameType, roomId: currentRoom });
            }
        });

        // گزینه ۳ و ۴: ورود به صف
        function joinQueue(gameType) {
            socket.emit('join-queue', { gameType, roomId: currentRoom });
            document.getElementById('game-arena-box').classList.remove('hidden');
            document.getElementById('arena-rps').classList.add('hidden');
            document.getElementById('arena-xo').classList.add('hidden');
            document.getElementById('arena-dice').classList.add('hidden');
            document.getElementById('arena-status').innerText = 'در حال جستجو برای تکمیل ظرفیت...';
        }

        socket.on('queue-status', d => {
            document.getElementById('arena-status').innerText = d.msg;
        });

        socket.on('enter-session', data => {
            activeSessionId = data.sessionId;
            isBotMode = false;
            document.getElementById('game-arena-box').classList.remove('hidden');
            document.getElementById('arena-rps').classList.add('hidden');
            document.getElementById('arena-xo').classList.add('hidden');
            document.getElementById('arena-dice').classList.add('hidden');

            if (data.gameType === 'xo') {
                document.getElementById('arena-xo').classList.remove('hidden');
                document.getElementById('arena-status').innerText = 'بازی دوز شروع شد!';
                document.querySelectorAll('.xo-cell').forEach(c => c.innerText = '');
            } else if (data.gameType === 'rps') {
                document.getElementById('arena-rps').classList.remove('hidden');
                document.getElementById('arena-status').innerText = 'بازی سنگ کاغذ قیچی';
                document.getElementById('rps-res').innerText = '';
            } else if (data.gameType === 'dice3' || data.gameType === 'dice') {
                document.getElementById('arena-dice').classList.remove('hidden');
                document.getElementById('arena-status').innerText = 'بازی تاس گروهی';
                document.getElementById('dice-res').innerText = '';
            } else if (data.gameType === 'hokm4') {
                document.getElementById('arena-status').innerText = 'ظرفیت حکم تکمیل شد! بازی حکم در حال اجراست...';
            }
        });

        function playRpsAction(move) {
            if (isBotMode) {
                socket.emit('play-bot', { gameType: 'rps', move });
            } else {
                socket.emit('session-rps-move', { roomId: currentRoom, sessionId: activeSessionId, move });
            }
        }

        socket.on('bot-rps-result', d => {
            document.getElementById('rps-res').innerHTML = `شما: ${d.myMove} | ربات: ${d.botMove}<br><b>${d.result}</b>`;
            document.getElementById('my-coins').innerText = d.newCoins;
        });

        function playXo(index) {
            socket.emit('session-xo-move', { roomId: currentRoom, sessionId: activeSessionId, index });
        }
        socket.on('session-xo-update', d => {
            document.querySelectorAll('.xo-cell').forEach((c, i) => c.innerText = d.board[i]);
            document.getElementById('arena-status').innerText = d.turn === socket.id ? 'نوبت شماست' : 'نوبت حریف...';
        });
        socket.on('session-xo-over', d => {
            document.querySelectorAll('.xo-cell').forEach((c, i) => c.innerText = d.board[i]);
            document.getElementById('arena-status').innerText = d.msg;
        });

        function rollDice() {
            socket.emit('session-dice-roll', { roomId: currentRoom, sessionId: activeSessionId });
        }
        socket.on('session-dice-result', d => {
            let txt = 'نتایج تاس:<br>';
            for (let id in d.rolls) txt += `${d.names[id]}: ${d.rolls[id]}<br>`;
            document.getElementById('dice-res').innerHTML = txt;
        });

        function closeArena() { document.getElementById('game-arena-box').classList.add('hidden'); }

        function sendMessage() {
            let input = document.getElementById('chat-input');
            let msg = input.value.trim();
            if (!msg) return;
            socket.emit('send-message', { roomId: currentRoom, message: msg, senderName: myName });
            input.value = '';
        }
        socket.on('receive-message', d => {
            let box = document.getElementById('chat-messages');
            let div = document.createElement('div');
            div.className = `message-bubble ${d.senderName === myName ? 'my-message' : 'other-message'}`;
            div.innerHTML = `<span class="msg-sender">${d.senderName}</span><span>${d.message}</span>`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        });
        socket.on('load-chat-history', h => {
            let box = document.getElementById('chat-messages');
            box.innerHTML = '';
            h.forEach(m => {
                let div = document.createElement('div');
                div.className = `message-bubble ${m.senderName === myName ? 'my-message' : 'other-message'}`;
                div.innerHTML = `<span class="msg-sender">${m.senderName}</span><span>${m.message}</span>`;
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        });
    </script>
</body>
</html>
