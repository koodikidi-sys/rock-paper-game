<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی آنلاین</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #0f172a; color: #f8fafc; text-align: center; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: #1e293b; padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; font-size: 16px; box-sizing: border-box; }
        input { background: #0f172a; color: #fff; border: 1px solid #334155; text-align: center; }
        button { background-color: #6366f1; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #4f46e5; }
        .stats { display: flex; justify-content: space-around; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; margin-bottom: 15px; }
        .hidden { display: none !important; }
        #status-msg { font-weight: bold; margin: 15px 0; color: #38bdf8; }
        #result-box { margin-top: 15px; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 8px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>سنگ کاغذ قیچی آنلاین</h2>
        
        <div id="lobby">
            <p>کد اتاق را وارد کنید:</p>
            <input type="text" id="room-code" placeholder="مثلاً: 123">
            <button onclick="connectRoom()">ورود به بازی</button>
        </div>

        <div id="game-room" class="hidden">
            <div class="stats">
                <div>💰 سکه شما: <span id="my-coins">1000</span></div>
                <div>⚔️ سکه حریف: <span id="opp-coins">1000</span></div>
            </div>

            <div id="status-msg">در انتظار ورود حریف...</div>

            <div id="controls" class="hidden">
                <button onclick="makeMove('سنگ')">✊ سنگ</button>
                <button onclick="makeMove('کاغذ')">✋ کاغذ</button>
                <button onclick="makeMove('قیچی')">✌️ قیچی</button>
            </div>

            <div id="result-box" class="hidden"></div>
        </div>
    </div>

    <!-- کتابخانه socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentRoom = '';

        function connectRoom() {
            const code = document.getElementById('room-code').value.trim();
            if (!code) {
                alert('لطفاً کد اتاق را وارد کنید.');
                return;
            }
            currentRoom = code;
            socket.emit('join-room', currentRoom);

            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('game-room').classList.remove('hidden');
        }

        socket.on('joined', (data) => {
            document.getElementById('my-coins').innerText = data.coins;
        });

        socket.on('start-game', (msg) => {
            document.getElementById('status-msg').innerText = msg;
            document.getElementById('controls').classList.remove('hidden');
        });

        socket.on('room-full', (msg) => {
            alert(msg);
            location.reload();
        });

        function makeMove(move) {
            document.getElementById('status-msg').innerText = `انتخاب شما (${move}) ثبت شد. منتظر حریف...`;
            document.getElementById('controls').classList.add('hidden');
            socket.emit('make-move', { roomId: currentRoom, move: move });
        }

        socket.on('round-result', (data) => {
            document.getElementById('my-coins').innerText = data.myCoins;
            document.getElementById('opp-coins').innerText = data.oppCoins;

            const resBox = document.getElementById('result-box');
            resBox.classList.remove('hidden');
            resBox.innerHTML = `
                انتخاب شما: ${data.myMove} <br>
                انتخاب حریف: ${data.oppMove} <br><br>
                <b style="color: #4ade80;">${data.result}</b>
            `;
            document.getElementById('status-msg').innerText = 'دور جدید! انتخاب کنید:';
            document.getElementById('controls').classList.remove('hidden');
        });

        socket.on('opponent-left', (msg) => {
            document.getElementById('status-msg').innerText = msg;
            document.getElementById('controls').classList.add('hidden');
        });
    </script>
</body>
</html>
