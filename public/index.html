<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سنگ کاغذ قیچی آنلاین</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #1e1e2f; color: #fff; text-align: center; padding: 50px; }
        .container { background-color: #2a2a40; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        button { background-color: #ff4757; color: white; border: none; padding: 10px 20px; margin: 10px; font-size: 16px; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #ff6b81; }
        #status, #result { font-size: 18px; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2>سنگ، کاغذ، قیچی آنلاین</h2>
        <div id="status">در حال اتصال به سرور و انتظار برای حریف...</div>
        
        <div id="game-board" style="display: none;">
            <p>انتخاب کنید:</p>
            <button onclick="makeChoice('سنگ')">✊ سنگ</button>
            <button onclick="makeChoice('کاغذ')">✋ کاغذ</button>
            <button onclick="makeChoice('قیچی')">✌️ قیچی</button>
        </div>

        <div id="result"></div>
    </div>

    <!-- بارگذاری Socket.io از سرور -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let playerNum = null;

        socket.on('player-assigned', (num) => {
            playerNum = num;
            if (num === 1) {
                document.getElementById('status').innerText = 'شما بازیکن اول هستید. منتظر ورود حریف...';
            } else {
                document.getElementById('status').innerText = 'حریف متصل شد! بازی شروع شد.';
                document.getElementById('game-board').style.display = 'block';
            }
        });

        // اگر بازیکن اول منتظر بود و دومی آمد
        socket.on('player-assigned', (num) => {
            playerNum = num;
            document.getElementById('status').innerText = `شما بازیکن شماره ${num} هستید.`;
            document.getElementById('game-board').style.display = 'block';
        });

        socket.on('full', (msg) => {
            document.getElementById('status').innerText = msg;
        });

        function makeChoice(choice) {
            document.getElementById('status').innerText = `انتخاب شما: ${choice}. منتظر انتخاب حریف...`;
            document.getElementById('game-board').style.display = 'none';
            socket.emit('make-choice', { choice });
        }

        socket.on('game-result', (data) => {
            document.getElementById('result').innerHTML = `
                انتخاب شما: ${data.yourChoice} <br>
                انتخاب حریف: ${data.opponentChoice} <br><br>
                <span style="color: #2ed573;">نتیجه: ${data.result}</span>
            `;
            // دکمه‌ها رو دوباره نشون بده تا دور بعد بتونen بازی کنن
            setTimeout(() => {
                document.getElementById('game-board').style.display = 'block';
                document.getElementById('status').innerText = 'دور جدید! انتخاب کنید:';
                document.getElementById('result').innerHTML = '';
            }, 4000);
        });

        socket.on('opponent-left', (msg) => {
            document.getElementById('status').innerText = msg;
            document.getElementById('game-board').style.display = 'none';
        });
    </script>

</body>
</html>
