<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گپ و بازی آنلاین - تلگرام استایل</title>
    <style>
        :root { 
            --tg-bg: #0b0f19; 
            --tg-panel: rgba(30, 41, 59, 0.7); 
            --tg-accent: #38bdf8; 
            --tg-accent-hover: #0ea5e9; 
            --tg-my-message: rgba(43, 82, 120, 0.85); 
            --tg-other-message: rgba(24, 37, 51, 0.85); 
            --tg-text: #f8fafc; 
            --tg-gray: #94a3b8; 
        }

        body { 
            font-family: Tahoma, sans-serif; 
            background: linear-gradient(135deg, #0f172a, #020617); 
            color: var(--tg-text); 
            text-align: center; 
            margin: 0; 
            padding: 10px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden;
            box-sizing: border-box; 
        }

        .container { 
            background-color: var(--tg-panel); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px; 
            border-radius: 16px; 
            width: 100%; 
            max-width: 420px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); 
            display: flex; 
            flex-direction: column; 
            height: 96vh; 
            max-height: 820px; 
            box-sizing: border-box; 
            overflow: hidden;
        }

        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; flex-shrink: 0; }
        h2 { margin: 0; font-size: 14px; color: var(--tg-accent); }
        
        .donate-header-btn { 
            background: linear-gradient(135deg, #db2777, #be185d); 
            color: white; 
            text-decoration: none; 
            display: block; 
            padding: 4px; 
            border-radius: 8px; 
            font-size: 11px; 
            font-weight: bold; 
            margin-bottom: 5px; 
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(219,39,119,0.3);
        }

        .group-profile-box { background: rgba(0,0,0,0.25); padding: 4px 8px; border-radius: 8px; margin-bottom: 4px; text-align: right; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .group-info h3 { margin: 0; font-size: 12px; color: var(--tg-accent); }
        .group-info p { margin: 2px 0 0 0; font-size: 10px; color: var(--tg-gray); }

        .game-options-panel { background: rgba(0,0,0,0.25); padding: 5px; border-radius: 8px; margin-bottom: 4px; text-align: right; flex-shrink: 0; }
        .game-options-title { font-size: 10px; color: var(--tg-accent); font-weight: bold; margin-bottom: 2px; }
        .game-btn { background: rgba(51, 65, 85, 0.8); font-size: 10px; padding: 3px 6px; margin: 2px 0; border-radius: 6px; text-align: right; width: 100%; border: 1px solid rgba(255,255,255,0.05); }
        .game-btn:hover { background: var(--tg-accent); color: #0f172a; }

        .members-box { background: rgba(0,0,0,0.25); padding: 4px; border-radius: 8px; margin-bottom: 4px; text-align: right; max-height: 55px; overflow-y: auto; flex-shrink: 0; }
        .members-title { font-size: 10px; color: var(--tg-gray); margin-bottom: 2px; font-weight: bold; }
        .member-item { font-size: 10px; margin: 2px 0; display: flex; justify-content: space-between; align-items: center; background: rgba(51, 65, 85, 0.6); padding: 2px 6px; border-radius: 4px; }

        input, button { width: 100%; padding: 7px 10px; margin: 4px 0; border-radius: 8px; border: none; font-size: 12px; box-sizing: border-box; }
        input { background: rgba(11, 19, 41, 0.8); color: #fff; border: 1px solid rgba(255,255,255,0.1); text-align: right; outline: none; }
        input:focus { border-color: var(--tg-accent); }
        
        button { background-color: var(--tg-accent); color: #0f172a; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: var(--tg-accent-hover); }
        .btn-danger { background-color: #ef4444; color: white; font-size: 10px; padding: 3px 6px; width: auto; margin: 0; }
        .btn-secondary { background-color: rgba(51, 65, 85, 0.9); color: white; }
        
        .stats { display: flex; justify-content: space-around; background: rgba(0,0,0,0.25); padding: 4px; border-radius: 8px; margin-bottom: 4px; font-size: 11px; flex-shrink: 0; }
        .hidden { display: none !important; }

        .gift-box { background: rgba(255,255,255,0.03); padding: 4px; border-radius: 6px; margin-bottom: 4px; display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
        .gift-box input { margin: 0; padding: 5px; font-size: 11px; }
        .gift-box button { margin: 0; padding: 5px; font-size: 11px; width: 70px; background-color: #10b981; color: white; }

        .game-arena { background: rgba(11, 19, 41, 0.9); border: 1px solid rgba(255,255,255,0.1); padding: 6px; border-radius: 10px; margin-bottom: 4px; text-align: center; flex-shrink: 0; }
        .xo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: 4px auto; max-width: 130px; }
        .xo-cell { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255,255,255,0.1); height: 36px; font-size: 16px; font-weight: bold; color: var(--tg-accent); display: flex; justify-content: center; align-items: center; cursor: pointer; border-radius: 6px; }

        .chat-container { 
            display: flex; 
            flex-direction: column; 
            flex: 1; 
            min-height: 0; 
            background: rgba(11, 19, 41, 0.6); 
            border-radius: 10px; 
            padding: 5px; 
            margin-bottom: 4px; 
            border: 1px solid rgba(255,255,255,0.05); 
            overflow: hidden; 
        }

        #chat-messages { 
            flex: 1; 
            min-height: 0; 
            overflow-y: auto; 
            font-size: 11px; 
            margin-bottom: 4px; 
            padding: 4px; 
            display: flex; 
            flex-direction: column; 
            gap: 4px; 
            text-align: right; 
            scroll-behavior: smooth;
        }
        
        .message-bubble { max-width: 80%; padding: 5px 8px; border-radius: 8px; word-break: break-word; line-height: 1.35; position: relative; backdrop-filter: blur(4px); }
        .message-bubble.my-message { background-color: var(--tg-my-message); align-self: flex-start; border-bottom-right-radius: 2px; }
        .message-bubble.other-message { background-color: var(--tg-other-message); align-self: flex-end; border-bottom-left-radius: 2px; }
        .msg-sender { font-size: 9px; color: var(--tg-accent); margin-bottom: 2px; font-weight: bold; display: block; }
        
        .chat-input-row { display: flex; gap: 4px; margin: 0; flex-shrink: 0; }
        .chat-input-row input { text-align: right; padding: 5px 7px; margin: 0; font-size: 11px; }
        .chat-input-row button { width: 50px; margin: 0; padding: 5px; font-size: 11px; border-radius: 6px; }

        .footer-credit { font-size: 9px; color: var(--tg-gray); margin-top: 2px; flex-shrink: 0; }
        .footer-credit a { color: var(--tg-accent); text-decoration: none; font-weight: bold; }
        .footer-credit a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-row">
            <h2>گپ و بازی آنلاین 💬</h2>
            <button id="btn-leave" class="btn-danger hidden" onclick="leaveGroup()">خروج 🚪</button>
        </div>

        <a href="https://daramet.com/yasinafzhooli" target="_blank" class="donate-header-btn">💖 حمایت مالی</a>

        <div id="auth-section">
            <div id="login-form">
                <input type="text" id="login-user" placeholder="نام کاربری">
                <input type="password" id="login-pass" placeholder="رمز عبور">
                <button onclick="loginUser()">ورود</button>
                <button class="btn-secondary" onclick="showRegister()">ثبت‌نام</button>
                <div id="login-alert" style="color:#ef4444; font-size:11px;"></div>
            </div>
            <div id="register-form" class="hidden">
                <input type="text" id="reg-user" placeholder="نام کاربری">
                <input type="password" id="reg-pass" placeholder="رمز عبور">
                <button onclick="registerUser()">ثبت‌نام نهایی</button>
                <button class="btn-secondary" onclick="showLogin()">بازگشت</button>
                <div id="reg-alert" style="color:#ef4444; font-size:11px;"></div>
            </div>
        </div>

        <div id="lobby" class="hidden">
            <p id="welcome-msg" style="color: var(--tg-accent); font-weight: bold; font-size: 12px;"></p>
            <input type="text" id="room-code" placeholder="نام گروه">
            <button onclick="connectRoom()">ورود به گروه</button>
            <button class="btn-secondary" onclick="logoutUser()">خروج از حساب</button>
        </div>

        <div id="game-room" class="hidden" style="display: flex; flex-direction: column; flex: 1; min-height: 0;">
            <div class="group-profile-box">
                <div class="group-info">
                    <h3 id="group-title-view">گروه</h3>
                    <p id="group-desc-view">...</p>
                </div>
            </div>

            <div class="game-options-panel">
                <div class="game-options-title">🎮 انتخاب حالت بازی:</div>
                <button class="game-btn" onclick="openBotGame()">۱. بازی تک‌نفره (با ربات)</button>
                <button class="game-btn" onclick="joinQueue('dice3')">۳. ورود به صف تاس ۳ نفره</button>
                <button class="game-btn" onclick="joinQueue('hokm4')">۴. ورود به صف حکم ۴ نفره</button>
            </div>

            <div class="members-box">
                <div class="members-title">👥 ۲. بازی دونفره (کلیک روی دوست برای دعوت):</div>
                <div id="members-list"></div>
            </div>

            <div class="stats">
                <div>💰 سکه: <span id="my-coins">300</span></div>
            </div>

            <div class="gift-box">
                <input type="text" id="gift-user" placeholder="نام کاربری دوست..." style="flex: 2;">
                <input type="number" id="gift-amount" placeholder="مقدار" style="flex: 1;">
                <button onclick="sendCoinGift()">هدیه 🎁</button>
            </div>

            <div id="game-arena-box" class="game-arena hidden">
                <div id="arena-status" style="font-size: 11px; font-weight: bold; color: var(--tg-accent); margin-bottom: 4px;"></div>
                
                <div id="arena-rps" class="hidden">
                    <button style="padding:4px; font-size:10px; width:auto;" onclick="playRpsAction('سنگ')">✊ سنگ</button>
                    <button style="padding:4px; font-size:10px; width:auto;" onclick="playRpsAction('کاغذ')">✋ کاغذ</button>
                    <button style="padding:4px; font-size:10px; width:auto;" onclick="playRpsAction('قیچی')">✌️ قیچی</button>
                    <div id="rps-res" style="font-size: 10px; margin-top: 2px;"></div>
                </div>

                <div id="arena-xo" class="hidden">
                    <div class="xo-grid" id="xo-board">
                        <div class="xo-cell" onclick="playXo(0)"></div>
                        <div class="xo-cell" onclick="playXo(1)"></div>
                        <div class="xo-cell" onclick="playXo(2)"></div>
                        <div class="xo-cell" onclick="playXo(3)"></div>
                        <div class="xo-cell" onclick="playXo(4)"></div>
                        <div class="xo-cell" onclick="playXo(5)"></div>
                        <div class="xo-cell" onclick="playXo(6)"></div>
                        <div class="xo-cell" onclick="playXo(7)"></div>
                        <div class="xo-cell" onclick="playXo(8)"></div>
                    </div>
                </div>

                <div id="arena-dice" class="hidden">
                    <button style="padding:4px; font-size:10px;" onclick="rollDice()">🎲 انداختن تاس</button>
                    <div id="dice-res" style="font-size: 10px; margin-top: 2px;"></div>
                </div>

                <button class="btn-secondary" onclick="closeArena()" style="padding: 2px; font-size: 9px; margin-top: 3px;">بستن میز بازی</button>
            </div>

            <div class="chat-container">
                <div id="chat-messages"></div>
                <div class="chat-input-row">
                    <input type="text" id="chat-input" placeholder="پیام..." onkeydown="if(event.key==='Enter') sendMessage()">
                    <button onclick="sendMessage()">ارسال</button>
                </div>
            </div>

            <div class="footer-credit">ساخته شده با عشق توسط <a href="https://www.instagram.com/iyac1n/?utm_source=ig_web_button_share_sheet" target="_blank">یاسین افژولی</a></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentRoom = localStorage.getItem('chat_game_room') || '';
        let myName = localStorage.getItem('chat_game_user') || '';
        let activeSessionId = null;
        let isBotMode = false;

        window.onload = () => {
            if (myName) {
                document.getElementById('auth-section').classList.add('hidden');
                if (currentRoom) {
                    socket.emit('join-room', { roomId: currentRoom, username: myName });
                    document.getElementById('game-room').classList.remove('hidden');
                    document.getElementById('btn-leave').classList.remove('hidden');
                } else {
                    document.getElementById('lobby').classList.remove('hidden');
                    document.getElementById('welcome-msg').innerText = `سلام، ${myName}!`;
                }
            }
        };

        function showRegister() { document.getElementById('login-form').classList.add('hidden'); document.getElementById('register-form').classList.remove('hidden'); }
        function showLogin() { document.getElementById('register-form').classList.add('hidden'); document.getElementById('login-form').classList.remove('hidden'); }

        async function registerUser() {
            let username = document.getElementById('reg-user').value.trim();
            let password = document.getElementById('reg-pass').value.trim();
            let res = await fetch('/api/register', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({username, password}) });
            let data = await res.json();
            if (data.success) showLogin(); else document.getElementById('reg-alert').innerText = data.message;
        }

        async function loginUser() {
            let username = document.getElementById('login-user').value.trim();
            let password = document.getElementById('login-pass').value.trim();
            let res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({username, password}) });
            let data = await res.json();
            if (data.success) {
                myName = data.username;
                localStorage.setItem('chat_game_user', myName);
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('lobby').classList.remove('hidden');
                document.getElementById('welcome-msg').innerText = `سلام، ${myName}!`;
                document.getElementById('my-coins').innerText = data.coins;
            } else {
                document.getElementById('login-alert').innerText = data.message;
            }
        }

        function logoutUser() { localStorage.clear(); location.reload(); }
        function connectRoom() {
            let code = document.getElementById('room-code').value.trim();
            if (!code) return;
            currentRoom = code;
            localStorage.setItem('chat_game_room', currentRoom);
            socket.emit('join-room', { roomId: currentRoom, username: myName });
            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('game-room').classList.remove('hidden');
            document.getElementById('btn-leave').classList.remove('hidden');
        }
        function leaveGroup() { localStorage.removeItem('chat_game_room'); location.reload(); }

        socket.on('room-profile', p => {
            document.getElementById('group-title-view').innerText = p.title;
            document.getElementById('group-desc-view').innerText = p.description;
        });

        socket.on('update-members', members => {
            let list = document.getElementById('members-list');
            list.innerHTML = '';
            members.forEach(m => {
                if (m.username !== myName) {
                    let div = document.createElement('div');
                    div.className = 'member-item';
                    div.innerHTML = `<span>👤 ${m.username}</span> <button style="width:auto; padding:2px 6px; font-size:9px;" onclick="challengeFriend('${m.id}', '${m.username}')">دعوت 🎮</button>`;
                    list.appendChild(div);
                }
            });
        });

        function openBotGame() {
            isBotMode = true;
            document.getElementById('game-arena-box').classList.remove('hidden');
            document.getElementById('arena-rps').classList.remove('hidden');
            document.getElementById('arena-xo').classList.add('hidden');
            document.getElementById('arena-dice').classList.add('hidden');
            document.getElementById('arena-status').innerText = 'بازی با ربات (سنگ کاغذ قیچی)';
            document.getElementById('rps-res').innerText = '';
        }

        function challengeFriend(targetId, targetName) {
            let g = prompt(`انتخاب بازی دونفره با ${targetName}:\n1. دوز (xo)\n2. سنگ‌کاغذ‌قیچی (rps)\n3. تاس (dice)`, '1');
            if (!g) return;
            let gameType = g === '2' || g.includes('rps') ? 'rps' : (g === '3' || g.includes('dice') ? 'dice' : 'xo');
            socket.emit('challenge-player', { targetId, gameType, roomId: currentRoom });
            alert('درخواست بازی ارسال شد.');
        }

        socket.on('game-challenge-received', d => {
            if (confirm(`${d.challengerName} شما را به بازی ${d.gameType} دعوت کرده است. قبول می‌کنید؟`)) {
                socket.emit('accept-challenge', { challengerId: d.challengerId, gameType: d.gameType, roomId: currentRoom });
            }
        });

        function joinQueue(gameType) {
            socket.emit('join-queue', { gameType, roomId: currentRoom });
            document.getElementById('game-arena-box').classList.remove('hidden');
            document.getElementById('arena-rps').classList.add('hidden');
            document.getElementById('arena-xo').classList.add('hidden');
            document.getElementById('arena-dice').classList.add('hidden');
            document.getElementById('arena-status').innerText = 'در حال جستجو برای تکمیل ظرفیت...';
        }

        socket.on('queue-status', d => {
            document.getElementById('arena-status').innerText = d.msg;
        });

        socket.on('enter-session', data => {
            activeSessionId = data.sessionId;
            isBotMode = false;
            document.getElementById('game-arena-box').classList.remove('hidden');
            document.getElementById('arena-rps').classList.add('hidden');
            document.getElementById('arena-xo').classList.add('hidden');
            document.getElementById('arena-dice').classList.add('hidden');

            if (data.gameType === 'xo') {
                document.getElementById('arena-xo').classList.remove('hidden');
                document.getElementById('arena-status').innerText = 'بازی دوز شروع شد!';
                document.querySelectorAll('.xo-cell').forEach(c => c.innerText = '');
            } else if (data.gameType === 'rps') {
                document.getElementById('arena-rps').classList.remove('hidden');
                document.getElementById('arena-status').innerText = 'بازی سنگ کاغذ قیچی';
                document.getElementById('rps-res').innerText = '';
            } else if (data.gameType === 'dice3' || data.gameType === 'dice') {
                document.getElementById('arena-dice').classList.remove('hidden');
                document.getElementById('arena-status').innerText = 'بازی تاس گروهی';
                document.getElementById('dice-res').innerText = '';
            } else if (data.gameType === 'hokm4') {
                document.getElementById('arena-status').innerText = 'ظرفیت حکم تکمیل شد! بازی حکم در حال اجراست...';
            }
        });

        function playRpsAction(move) {
            if (isBotMode) {
                socket.emit('play-bot', { gameType: 'rps', move });
            } else {
                socket.emit('session-rps-move', { roomId: currentRoom, sessionId: activeSessionId, move });
            }
        }

        socket.on('bot-rps-result', d => {
            document.getElementById('rps-res').innerHTML = `شما: ${d.myMove} | ربات: ${d.botMove}<br><b>${d.result}</b>`;
            document.getElementById('my-coins').innerText = d.newCoins;
        });

        function playXo(index) {
            socket.emit('session-xo-move', { roomId: currentRoom, sessionId: activeSessionId, index });
        }
        socket.on('session-xo-update', d => {
            document.querySelectorAll('.xo-cell').forEach((c, i) => c.innerText = d.board[i]);
            document.getElementById('arena-status').innerText = d.turn === socket.id ? 'نوبت شماست' : 'نوبت حریف...';
        });
        socket.on('session-xo-over', d => {
            document.querySelectorAll('.xo-cell').forEach((c, i) => c.innerText = d.board[i]);
            document.getElementById('arena-status').innerText = d.msg;
        });

        function rollDice() {
            socket.emit('session-dice-roll', { roomId: currentRoom, sessionId: activeSessionId });
        }
        socket.on('session-dice-result', d => {
            let txt = 'نتایج تاس:<br>';
            for (let id in d.rolls) txt += `${d.names[id]}: ${d.rolls[id]}<br>`;
            document.getElementById('dice-res').innerHTML = txt;
        });

        function sendCoinGift() {
            let targetUser = document.getElementById('gift-user').value.trim();
            let amount = document.getElementById('gift-amount').value.trim();
            if (!targetUser || !amount) {
                alert('لطفاً نام کاربری و مقدار سکه را وارد کنید.');
                return;
            }
            socket.emit('transfer-coins', { targetUser, amount, senderUser: myName });
        }

        socket.on('transfer-result', d => {
            alert(d.message);
            if (d.success) {
                document.getElementById('my-coins').innerText = d.newCoins;
                document.getElementById('gift-user').value = '';
                document.getElementById('gift-amount').value = '';
            }
        });

        function closeArena() { document.getElementById('game-arena-box').classList.add('hidden'); }

        function sendMessage() {
            let input = document.getElementById('chat-input');
            let msg = input.value.trim();
            if (!msg) return;
            socket.emit('send-message', { roomId: currentRoom, message: msg, senderName: myName });
            input.value = '';
        }
        socket.on('receive-message', d => {
            let box = document.getElementById('chat-messages');
            let div = document.createElement('div');
            div.className = `message-bubble ${d.senderName === myName ? 'my-message' : 'other-message'}`;
            div.innerHTML = `<span class="msg-sender">${d.senderName}</span><span>${d.message}</span>`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        });
        socket.on('load-chat-history', h => {
            let box = document.getElementById('chat-messages');
            box.innerHTML = '';
            h.forEach(m => {
                let div = document.createElement('div');
                div.className = `message-bubble ${m.senderName === myName ? 'my-message' : 'other-message'}`;
                div.innerHTML = `<span class="msg-sender">${m.senderName}</span><span>${m.message}</span>`;
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        });
    </script>
</body>
</html>
